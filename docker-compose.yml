# The Good Times — runs standalone on the Hetzner server, fronted by the
# Caddy instance in the `hetzner-server` repo (domain: thegoodmark.msge.no).
#
# Caddy reaches this container via the Docker bridge gateway 172.18.0.1:4004,
# so the port is published on 0.0.0.0 (not 127.0.0.1). The Hetzner firewall
# only exposes 22/80/443 externally, so 4004 stays internal.

services:
  thegoodmark:
    build: .
    container_name: thegoodmark
    restart: unless-stopped
    ports:
      - "0.0.0.0:4004:4004"
    environment:
      PORT: 4004
      GOODNEWS_DB: /data/goodnews.db
    volumes:
      # SQLite state persists across rebuilds. Dir mount so WAL siblings work.
      - ./data:/data
