# The Good Times — runs standalone on the Hetzner server, fronted by the
# Caddy instance in the `naustet-server` repo (domain: thegoodtimes.msge.no).
#
# Caddy reaches this container via the Docker bridge gateway 172.18.0.1:4008,
# so the port is published on 0.0.0.0 (not 127.0.0.1). The Hetzner firewall
# only exposes 22/80/443 externally, so 4008 stays internal.

name: thegoodtimes

services:
  thegoodtimes:
    build: .
    container_name: thegoodtimes
    restart: unless-stopped
    ports:
      - "0.0.0.0:4008:4008"
    environment:
      PORT: 4008
      GOODNEWS_DB: /data/goodnews.db
    volumes:
      # SQLite state persists across rebuilds. Dir mount so WAL siblings work.
      - ./data:/data
    healthcheck:
      # /healthz, NEVER /health: this restarts the container on failure, and
      # /health answers "is a dependency degraded?" — pointing the healthcheck
      # at it would restart-loop the app whenever the feeds go quiet.
      # 127.0.0.1, not "localhost": localhost can resolve to ::1 while the
      # server listens on IPv4 only.
      # The body is byte-compared — a 200 carrying an error/HTML shell would
      # otherwise pass. The contract fixes the body at exactly "ok" (2 bytes).
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4008/healthz',r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>process.exit(r.statusCode===200&&b==='ok'?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
