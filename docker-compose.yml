# The Good Times — runs standalone on the Hetzner server, fronted by the
# Caddy instance in the `naustet-server` repo (domain: thegoodtimes.msge.no).
#
# Caddy reaches this container via the Docker bridge gateway 172.18.0.1:4008,
# so the port is published on 0.0.0.0 (not 127.0.0.1). The Hetzner firewall
# only exposes 22/80/443 externally, so 4008 stays internal.

name: thegoodtimes

services:
  thegoodtimes:
    build: .
    container_name: thegoodtimes
    restart: unless-stopped
    # Next.js 16 (`next start`) + better-sqlite3: the box template default for a Node
    # app. The RSS ingest walks the six feeds one at a time and the sentiment scorer
    # is an AFINN word list, not an ML runtime, so nothing here needs more. Next.js is
    # heavier than Express, though: if the container ever shows OOMKilled, raise this
    # to 384m (lesesalen runs there). The box is small (3.7 GB / 2 vCPU), always cap memory.
    mem_limit: 256m
    # Cap the container log: json-file never rotates on its own, and 10m x 3 is also how much output survives an outage of the central log collector (naustet-server ADR 0032).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:4008:4008"
    environment:
      PORT: 4008
      GOODNEWS_DB: /data/goodnews.db
    volumes:
      # SQLite state persists across rebuilds. Dir mount so WAL siblings work.
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4008/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
